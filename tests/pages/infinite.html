<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Infinite scroll</title>
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <script src="bands.js"></script>
    <script>
      // Starts with ?initial= bands (default 10) and appends 10 more whenever
      // the reader gets near the bottom.
      let next = 0;
      const more = (count = 10) => {
        addBands(document.body, next, count, 250);
        next += count;
      };
      more(Number(new URLSearchParams(location.search).get('initial')) || 10);
      addEventListener('scroll', () => {
        if (scrollY + innerHeight > document.body.scrollHeight - 1000) more();
      });
    </script>
  </body>
</html>
