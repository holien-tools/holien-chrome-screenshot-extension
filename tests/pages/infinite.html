<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Infinite scroll</title>
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <script src="bands.js"></script>
    <script>
      // Appends more bands whenever the reader gets near the bottom.
      let next = 0;
      const more = () => {
        addBands(document.body, next, 10, 250);
        next += 10;
      };
      more();
      addEventListener('scroll', () => {
        if (scrollY + innerHeight > document.body.scrollHeight - 1000) more();
      });
    </script>
  </body>
</html>
