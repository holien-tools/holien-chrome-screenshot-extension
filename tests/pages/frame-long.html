<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Long page in a frame</title>
    <style>
      /* A shell with a bar at the top and a same-origin frame below it whose
         own document scrolls. */
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { display: flex; flex-direction: column; }
      #bar { flex: none; height: 50px; background: #333; }
      iframe { flex: 1; width: 100%; border: 0; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <iframe src="long.html"></iframe>
  </body>
</html>
