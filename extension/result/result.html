<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full page screenshot</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="result.css" />
    <script type="module" src="result.js"></script>
  </head>
  <body>
    <section id="capture-view" hidden>
      <header class="toolbar">
        <div class="toolbar-main">
          <div class="meta">
            <h1 id="page-title"></h1>
            <a id="page-url" target="_blank" rel="noopener noreferrer"></a>
            <p id="summary"></p>
          </div>
          <button id="copy" class="button secondary" type="button" hidden></button>
          <button id="download" class="button" type="button" hidden></button>
          <button id="download-all" class="button" type="button" hidden></button>
        </div>
        <div class="tools" role="group" aria-labelledby="tools-label">
          <span id="tools-label" class="tools-label" data-i18n="boxesLabel"></span>
          <div id="swatches" class="swatches" role="radiogroup"></div>
          <label class="custom-color">
            <input id="custom-color" type="color" value="#e53935" />
            <span class="swatch-ring" aria-hidden="true"></span>
            <span data-i18n="customColor"></span>
          </label>
          <label class="line-width">
            <span data-i18n="lineWidth"></span>
            <select id="line-width"></select>
          </label>
          <button id="undo" class="tool" type="button" data-i18n="undo" disabled></button>
          <button id="clear" class="tool" type="button" data-i18n="clearBoxes" disabled></button>
          <span id="box-status" class="tools-status" aria-live="polite"></span>
        </div>
      </header>
      <ul id="notices"></ul>
      <main id="parts"></main>
    </section>

    <section id="error-view" class="error" hidden>
      <h1 data-i18n="errorTitle"></h1>
      <p id="error-message"></p>
      <details id="error-details" hidden>
        <summary data-i18n="errorDetails"></summary>
        <code id="error-detail"></code>
      </details>
    </section>
  </body>
</html>
