<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full page screenshot</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="result.css" />
    <script type="module" src="result.js"></script>
  </head>
  <body>
    <section id="capture-view" hidden>
      <header class="toolbar">
        <div class="meta">
          <h1 id="page-title"></h1>
          <a id="page-url" target="_blank" rel="noopener noreferrer"></a>
          <p id="summary"></p>
        </div>
        <button id="copy" class="button secondary" type="button" hidden></button>
        <a id="download" class="button" hidden></a>
        <button id="download-all" class="button" type="button" hidden></button>
      </header>
      <ul id="notices"></ul>
      <main id="parts"></main>
    </section>

    <section id="error-view" class="error" hidden>
      <h1 data-i18n="errorTitle"></h1>
      <p id="error-message"></p>
      <details id="error-details" hidden>
        <summary data-i18n="errorDetails"></summary>
        <code id="error-detail"></code>
      </details>
    </section>
  </body>
</html>
