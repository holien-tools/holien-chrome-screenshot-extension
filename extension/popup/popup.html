<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <button class="mode" type="button" data-mode="full">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="2.5" width="14" height="19" rx="2" />
        <path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5" />
      </svg>
      <span data-i18n="popupFullPage"></span>
      <kbd hidden></kbd>
    </button>
    <button class="mode" type="button" data-mode="area">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4" />
        <rect x="7.5" y="7.5" width="9" height="9" rx="1" stroke-dasharray="2.5 2" />
      </svg>
      <span data-i18n="popupArea"></span>
      <kbd hidden></kbd>
    </button>
    <hr />
    <button id="settings" class="mode" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </svg>
      <span data-i18n="settings"></span>
    </button>
  </body>
</html>
